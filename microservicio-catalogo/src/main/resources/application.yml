server.port: 8081

spring.application.name: microservicio-catalogo
# ===============================
# CONEXION A MYSQL (XAMPP) Y CREACION AUTOMATICA DE BD
# ===============================
spring.datasource.url: jdbc:mysql://localhost:3306/catalogo_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username: root
spring.datasource.password: 
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACION DE HIBERNATE (CREACION DE TABLAS Y LOGS)
# ===============================
spring.jpa.hibernate.ddl-auto: update
spring.jpa.show-sql: true
spring.jpa.properties.hibernate.format_sql: true

---
spring:
  config:
    activate:
      on-profile: dev
