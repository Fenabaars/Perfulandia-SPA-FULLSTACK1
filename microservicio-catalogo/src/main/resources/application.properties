server.port=8081

spring.application.name=microservicio-catalogo
# ===============================
# CONEXIÓN A MYSQL (XAMPP) Y CREACIÓN AUTOMÁTICA DE BD
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE HIBERNATE (CREACIÓN DE TABLAS Y LOGS)
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true